name: CI y GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm install
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Ejecutar pruebas CI/CD
        run: |
          set -o pipefail
          npm test 2>&1 | tee ci-output.log
      - name: Guardar salida de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-output
          path: ci-output.log

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar sitio
        run: |
          mkdir site
          cp -R paginaCristianoRonaldo/. site/
          touch site/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
